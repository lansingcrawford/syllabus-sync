<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A starter site for a student syllabus-to-calendar project." />
    <title>Syllabus Calendar — Starting Soon</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7ff; color: #152044; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 620px); border: 1px solid #dce2ff; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(38, 57, 142, .12); padding: clamp(32px, 7vw, 64px); text-align: center; }
      .badge { display: inline-block; border-radius: 999px; background: #e8edff; color: #334bb7; font-size: .85rem; font-weight: 700; letter-spacing: .06em; padding: 8px 12px; text-transform: uppercase; }
      h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: 1; margin: 22px 0 16px; }
      p { color: #556080; font-size: 1.1rem; line-height: 1.6; margin: 0 auto; max-width: 43ch; }
      .check { color: #227a50; font-weight: 700; margin-top: 28px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Build Day starter</span>
      <h1>Syllabus Calendar</h1>
      <p>This is the deployment check for a tool that will turn important syllabus dates into an academic calendar that is hard to ignore.</p>
      <p class="check">If you can see this, the public deployment is working.</p>
    </main>
  </body>
</html>
